        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:name: Deploy Go Backend

on:
  push:
    paths:
      - 'backend/**'
    branches: [ dev ] # Убедись, что это твоя рабочая ветка

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}/backend:latest
            
            # 1. ЗАПУСК МИГРАЦИЙ
            # Используем временный контейнер. Если миграции упадут, деплой остановится.
            docker run --rm \
              --network global_proxy \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e MIGRATIONS_DIR="migrations" \
              ghcr.io/${{ github.repository }}/backend:latest /app/migrate
            
            # 2. ОСТАНОВКА СТАРОГО БЭКЕНДА
            docker stop focus-backend || true
            docker rm focus-backend || true
            
            # 3. ЗАПУСК НОВОГО БЭКЕНДА
            docker run -d \
              --name focus-backend \
              --network global_proxy \
              --restart unless-stopped \
              -e PORT=8080 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e CORS_ORIGIN="https://focus.mathalama.dev" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e TELEGRAM_BOT_AUTH_TOKEN="${{ secrets.TELEGRAM_BOT_AUTH_TOKEN }}" \
              -e RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
              -e EMAIL_VERIFY_URL_BASE="https://focus-api.mathalama.dev/api/v1/auth/verify-email" \
              -e EMAIL_VERIFY_SUCCESS_REDIRECT="https://focus.mathalama.dev/login?verified=1" \
              -e EMAIL_VERIFY_FAIL_REDIRECT="https://focus.mathalama.dev/login?verified=0" \
              ghcr.io/${{ github.repository }}/backend:latest