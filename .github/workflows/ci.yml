name: CI

on:
  push:
    branches: [dev, stage, prod]
  pull_request:
    branches: [dev, stage, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-phase:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.phase.outputs.value }}
    steps:
      - id: phase
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev) echo "value=internal-testing" >> "$GITHUB_OUTPUT" ;;
            stage) echo "value=open-testing" >> "$GITHUB_OUTPUT" ;;
            prod) echo "value=release" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=unknown" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Print branch phase
        run: echo "Branch ${{ github.ref_name }} mapped to phase ${{ steps.phase.outputs.value }}"

  backend-build:
    runs-on: ubuntu-latest
    needs: release-phase
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build backend binaries
        run: |
          go build ./cmd/api
          go build ./cmd/migrate

  telegram-bot-build:
    runs-on: ubuntu-latest
    needs: release-phase
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: telegram-bot/go.mod
      - name: Build telegram-bot
        run: go build ./...

  frontend-build:
    runs-on: ubuntu-latest
    needs: release-phase
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  compose-validate:
    runs-on: ubuntu-latest
    needs: release-phase
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        run: docker compose config

  phase-gate:
    runs-on: ubuntu-latest
    needs: [release-phase, backend-build, telegram-bot-build, frontend-build, compose-validate]
    steps:
      - name: Internal testing gate
        if: github.ref == 'refs/heads/dev'
        run: echo "Internal testing pipeline passed for dev."
      - name: Open testing gate
        if: github.ref == 'refs/heads/stage'
        run: echo "Open testing pipeline passed for stage."
      - name: Release gate
        if: github.ref == 'refs/heads/prod'
        run: echo "Release pipeline passed for prod."
