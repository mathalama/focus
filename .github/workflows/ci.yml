name: CI/CD Focus Project

on:
  push:
    branches: [dev, stage, prod]
  workflow_dispatch:

jobs:
  # 1. Валидация
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary env files
        run: |
          touch .env
          mkdir -p backend && touch backend/.env
          mkdir -p telegram-bot && touch telegram-bot/.env
      - name: Validate Docker Compose
        run: docker compose config

  # 2. Сборка
  build-and-push-backend:
    needs: compose-validate
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

  # 3. Деплой
  deploy-backend:
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Native SSH
        env:
          # УБРАЛИ лишние '$' перед скобками!
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Теперь $SERVER_IP будет содержать чистый адрес
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa ubuntu@$SERVER_IP << EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}/backend:latest
            
            docker run --rm --network global_proxy \
              -e DATABASE_URL="$DATABASE_URL" \
              ghcr.io/${{ github.repository }}/backend:latest /app/migrate
            
            docker stop focus-backend || true
            docker rm focus-backend || true
            
            docker run -d \
              --name focus-backend \
              --network global_proxy \
              --restart unless-stopped \
              -e PORT=8080 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e TELEGRAM_BOT_AUTH_TOKEN="${{ secrets.TELEGRAM_BOT_AUTH_TOKEN }}" \
              ghcr.io/${{ github.repository }}/backend:latest
          EOF