name: CI/CD

on:
  push:
    branches: [dev, stage, prod]
  workflow_dispatch:

jobs:
  # ... (оставляем твои билды backend-test, frontend-build и т.д. без изменений)

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create dummy env files
        run: |
          touch .env
          mkdir -p backend && touch backend/.env
          mkdir -p telegram-bot && touch telegram-bot/.env
      - name: Validate
        run: docker compose config

  build-and-push-backend:
    runs-on: ubuntu-latest
    needs: [compose-validate]
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-backend
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Deploy via native SSH
        env:
          # Прокидываем ВСЕ нужные секреты в окружение этого шага
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          # 1. Настройка ключа
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Добавление сервера в known_hosts (решает проблему getaddrinfo)
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          # 3. Запуск команд на сервере через нативный SSH
          # Используем EOF без кавычек, чтобы переменные подставились Гитхабом
          ssh -i ~/.ssh/id_rsa ubuntu@$SERVER_IP << EOF
            echo "Connected to server. Starting deployment..."
            
            # Авторизация в Docker
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Обновление образа
            docker pull ghcr.io/${{ github.repository }}/backend:latest
            
            # Запуск миграций
            docker run --rm --network global_proxy \
              -e DATABASE_URL="$DATABASE_URL" \
              ghcr.io/${{ github.repository }}/backend:latest /app/migrate
            
            # Перезапуск бэкенда
            docker stop focus-backend || true
            docker rm focus-backend || true
            
            docker run -d \
              --name focus-backend \
              --network global_proxy \
              --restart unless-stopped \
              -e PORT=8080 \
              -e DATABASE_URL="$DATABASE_URL" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e CORS_ORIGIN="https://focus.mathalama.dev" \
              ghcr.io/${{ github.repository }}/backend:latest
            
            echo "Deployment successful!"
          EOF