name: CI/CD

on:
  push:
    branches: [dev, stage, prod]
  pull_request:
    branches: [dev, stage, prod]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-phase:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.phase.outputs.value }}
    steps:
      - id: phase
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            dev) echo "value=internal-testing" >> "$GITHUB_OUTPUT" ;;
            stage) echo "value=open-testing" >> "$GITHUB_OUTPUT" ;;
            prod) echo "value=release" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=unknown" >> "$GITHUB_OUTPUT" ;;
          esac

  # Твои текущие проверки (CI)
  backend-test:
    runs-on: ubuntu-latest
    needs: release-phase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build check
        run: cd backend && go build ./cmd/api

  compose-validate:
    runs-on: ubuntu-latest
    needs: release-phase
    steps:
      - uses: actions/checkout@v4
      - name: Create dummy env files
        run: |
          touch .env
          mkdir -p backend && touch backend/.env
          mkdir -p telegram-bot && touch telegram-bot/.env
      - name: Validate
        run: docker compose config

  # --- НОВЫЙ ЭТАП: СБОРКА И ПУШ ОБРАЗА ---
  build-and-push-backend:
    runs-on: ubuntu-latest
    needs: [backend-test, compose-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

  # --- НОВЫЙ ЭТАП: ДЕПЛОЙ ПО SSH ---
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-backend
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Deploy via native SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }} # ОБЯЗАТЕЛЬНО ПРОКИНУТЬ ТУТ
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }} # И ЭТО ТОЖЕ
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Теперь $SERVER_IP будет виден внутри скрипта
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa ubuntu@"$SERVER_IP" << EOF
            echo "Connected successfully!"
            
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker pull ghcr.io/${{ github.repository }}/backend:latest
            
            # Миграции
            docker run --rm --network global_proxy \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              ghcr.io/${{ github.repository }}/backend:latest /app/migrate
            
            # Перезапуск
            docker stop focus-backend || true
            docker rm focus-backend || true
            
            docker run -d \
              --name focus-backend \
              --network global_proxy \
              --restart unless-stopped \
              -e PORT=8080 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e CORS_ORIGIN="https://focus.mathalama.dev" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e TELEGRAM_BOT_AUTH_TOKEN="${{ secrets.TELEGRAM_BOT_AUTH_TOKEN }}" \
              -e RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
              -e EMAIL_VERIFY_URL_BASE="https://focus-api.mathalama.dev/api/v1/auth/verify-email" \
              -e EMAIL_VERIFY_SUCCESS_REDIRECT="https://focus.mathalama.dev/login?verified=1" \
              -e EMAIL_VERIFY_FAIL_REDIRECT="https://focus.mathalama.dev/login?verified=0" \
              ghcr.io/${{ github.repository }}/backend:latest
          EOF