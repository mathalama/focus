openapi: 3.0.0
info:
  title: Focus API
  description: API for the Focus productivity application.
  version: 1.1.0
servers:
  - url: /
    description: Local server
paths:
  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /health/db:
    get:
      summary: Database health check
      tags: [System]
      responses:
        '200':
          description: Database is healthy
  /metrics:
    get:
      summary: Prometheus metrics
      tags: [System]
      responses:
        '200':
          description: Metrics in Prometheus format
  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOutput'
  /api/v1/auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
  /api/v1/auth/dev-login:
    post:
      summary: Developer login (bypass email verification)
      tags: [Auth]
      description: Available only when development mode is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
  /api/v1/auth/logout:
    post:
      summary: Logout current session
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
  /api/v1/auth/logout-all:
    post:
      summary: Logout all sessions
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All sessions revoked
  /api/v1/auth/sessions:
    get:
      summary: List active auth sessions
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSession'
  /api/v1/auth/verify-email:
    get:
      summary: Verify email address
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
  /api/v1/auth/verify-email/resend:
    post:
      summary: Resend verification email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Resent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOutput'
  /api/v1/me:
    get:
      summary: Get current user profile
      tags: [User]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v1/goals:
    get:
      summary: List goals
      tags: [Goals]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
    post:
      summary: Create a new goal
      tags: [Goals]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalInput'
      responses:
        '201':
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
  /api/v1/goals/history:
    get:
      summary: List goal history
      tags: [Goals]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: History of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
  /api/v1/sessions:
    post:
      summary: Start a focus session
      tags: [Sessions]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionInput'
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSession'
  /api/v1/sessions/active:
    get:
      summary: Get active session
      tags: [Sessions]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active session found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSession'
  /api/v1/sessions/history:
    get:
      summary: List session history
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: List of session history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionHistoryEntry'
  /api/v1/sessions/{sessionID}:
    get:
      summary: Get session details
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSession'
  /api/v1/sessions/{sessionID}/pause:
    patch:
      summary: Pause a session
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session paused
  /api/v1/sessions/{sessionID}/resume:
    patch:
      summary: Resume a session
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session resumed
  /api/v1/sessions/{sessionID}/reset:
    patch:
      summary: Reset a session
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session reset
  /api/v1/sessions/{sessionID}/abandon:
    patch:
      summary: Abandon a session
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session abandoned
  /api/v1/sessions/{sessionID}/complete:
    patch:
      summary: Complete a session
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          schema:
            type: string
      responses:
        '200':
          description: Session completed
  /api/v1/sessions/{sessionID}/interruption:
    post:
      summary: Add an interruption to a session
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason]
              properties:
                kind:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Interruption added
  /api/v1/sessions/{sessionID}/reflection:
    post:
      summary: Upsert reflection for a session
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: sessionID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflectionInput'
      responses:
        '200':
          description: Reflection saved
  /api/v1/integrations/telegram/link:
    post:
      summary: Link telegram account (Bot-to-Bot)
      tags: [Integrations]
      security:
        - TelegramBotAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramLinkInput'
      responses:
        '200':
          description: Linked successfully
  /api/v1/integrations/telegram/status:
    get:
      summary: Get telegram status (Bot-to-Bot)
      tags: [Integrations]
      security:
        - TelegramBotAuth: []
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status information
  /api/v1/integrations/telegram/notifications:
    patch:
      summary: Set telegram notifications (Bot-to-Bot)
      tags: [Integrations]
      security:
        - TelegramBotAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, enabled]
              properties:
                user_id:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated successfully
  /api/v1/auth/telegram/link-code:
    post:
      summary: Create telegram link code for current user
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Link code generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
  /api/v1/integrations/telegram:
    get:
      summary: Get linked telegram identity
      tags: [Integrations]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Telegram identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramIdentity'
    delete:
      summary: Unlink telegram account
      tags: [Integrations]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Unlinked successfully
  /api/v1/analytics/overview:
    get:
      summary: Get analytics overview
      tags: [Analytics]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Overview data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverview'
  /api/v1/analytics/activity:
    get:
      summary: Get daily activity statistics
      tags: [Analytics]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Activity data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyActivity'
  /api/v1/analytics/activity/day:
    get:
      summary: Get session contributions for a specific day
      tags: [Analytics]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyContribution'
  /api/v1/analytics/insights:
    get:
      summary: Get AI-driven insights
      tags: [Analytics]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insight'
  /api/v1/leaderboard:
    get:
      summary: Get global leaderboard
      tags: [Gamification]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
  /api/v1/shop/items:
    get:
      summary: List available shop items
      tags: [Shop]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /api/v1/shop/items/{itemID}/buy:
    post:
      summary: Purchase a shop item
      tags: [Shop]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: itemID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Purchased item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserItem'
  /api/v1/admin/health:
    get:
      summary: Admin health check
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Admin health status
  /api/v1/admin/email-deliveries:
    get:
      summary: List email deliveries (Admin)
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of email deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailDelivery'
  /api/v1/admin/events:
    get:
      summary: List product events (Admin)
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of product events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductEvent'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    TelegramBotAuth:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Auth
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        nectar_balance: { type: integer }
        total_nectar_earned: { type: integer }
        created_at: { type: string, format: date-time }
    RegisterOutput:
      type: object
      properties:
        User: { $ref: '#/components/schemas/User' }
        VerificationEmailSent: { type: boolean }
        VerificationExpiresAt: { type: string, format: date-time }
    ResendOutput:
      type: object
      properties:
        Resent: { type: boolean }
        AlreadyVerified: { type: boolean }
        ExpiresAt: { type: string, format: date-time }
    AuthTokens:
      type: object
      properties:
        AccessToken: { type: string }
        RefreshToken: { type: string }
    AuthSession:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        user_agent: { type: string }
        ip_address: { type: string }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Goal:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        topic: { type: string }
        desired_result: { type: string }
        recommended_minutes: { type: integer }
        tags: { type: array, items: { type: string } }
        completed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CreateGoalInput:
      type: object
      properties:
        Topic: { type: string }
        DesiredResult: { type: string }
        RecommendedMinutes: { type: integer }
        Tags: { type: array, items: { type: string } }
    FocusSession:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        goal_id: { type: string }
        recommended_minutes: { type: integer }
        is_strict: { type: boolean }
        status: { type: string }
        pause_count: { type: integer }
        started_at: { type: string, format: date-time }
        paused_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
    StartSessionInput:
      type: object
      properties:
        GoalID: { type: string }
        RecommendedMinutes: { type: integer }
        IsStrict: { type: boolean }
    SessionHistoryEntry:
      type: object
      properties:
        session_id: { type: string }
        goal_id: { type: string }
        topic: { type: string }
        status: { type: string }
        recommended_minutes: { type: integer }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    ReflectionInput:
      type: object
      properties:
        WhatLearned: { type: string }
        WhatWasHard: { type: string }
        NextAction: { type: string }
    TelegramLinkInput:
      type: object
      properties:
        Code: { type: string }
        TelegramUserID: { type: integer, format: int64 }
        TelegramUsername: { type: string }
        TelegramFirst: { type: string }
        TelegramLast: { type: string }
    TelegramIdentity:
      type: object
      properties:
        telegram_user_id: { type: integer, format: int64 }
        telegram_username: { type: string }
        notifications_enabled: { type: boolean }
        linked_at: { type: string, format: date-time }
    AnalyticsOverview:
      type: object
      properties:
        completed_goals:
          type: integer
          description: Number of goals that have completed_at set.
        calm_score:
          type: number
          description: Average session score (0..100). For completed sessions base is 100 with penalties -9 per pause and -12 per logged interruption; for non-completed base is 55 with lighter penalties.
        focus_stability:
          type: number
          description: Average stability score (0..100) by session status. completed=100, paused=70, other statuses=50.
        calm_score_base:
          type: number
          description: Average base part of calm score before penalties (100 for completed sessions, 55 for other statuses).
        calm_score_pause_penalty:
          type: number
          description: Average pause penalty contribution deducted from calm score.
        calm_score_interruption_penalty:
          type: number
          description: Average interruption penalty contribution deducted from calm score.
        sessions_total:
          type: integer
          description: Total count of user sessions included in analytics.
        completed_sessions:
          type: integer
          description: Sessions with completed status.
        paused_sessions:
          type: integer
          description: Sessions currently paused.
        other_sessions:
          type: integer
          description: Sessions in statuses other than completed or paused.
        total_pauses:
          type: integer
          description: Total pauses across all sessions.
        total_interruptions:
          type: integer
          description: Total interruption events across all sessions.
        primary_action:
          type: string
          description: Suggested next optimization action key.
          enum: [start_sessions, complete_more_sessions, reduce_pauses, reduce_interruptions, stabilize_schedule, keep_momentum]
        best_hour_of_day_utc:
          type: integer
          description: Most frequent UTC start hour for user's sessions (0..23). -1 when no sessions exist.
        total_nectar_earned:
          type: integer
          description: Total earned points (sum of minutes from completed sessions).
    DailyActivity:
      type: object
      properties:
        date: { type: string }
        session_count: { type: integer }
        total_minutes: { type: integer }
    DailyContribution:
      type: object
      properties:
        session_id: { type: string }
        topic: { type: string }
        minutes: { type: integer }
    Insight:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
        type: { type: string }
    LeaderboardEntry:
      type: object
      properties:
        user_id: { type: string }
        name: { type: string }
        total_nectar_earned: { type: integer }
        rank: { type: integer }
    Item:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        cost: { type: integer }
        description: { type: string }
    UserItem:
      type: object
      properties:
        id: { type: string }
        item: { $ref: '#/components/schemas/Item' }
        purchased_at: { type: string, format: date-time }
    EmailDelivery:
      type: object
      properties:
        id: { type: string }
        to_email: { type: string }
        status: { type: string }
        sent_at: { type: string, format: date-time, nullable: true }
    ProductEvent:
      type: object
      properties:
        id: { type: string }
        event_name: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }
