<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 400px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .popup-container {
      padding: 20px;
    }
    
    .header {
      color: white;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }
    
    .status {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }
    
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    
    .status-badge.active {
      background: #FF6B6B;
      color: white;
    }
    
    .status-badge.inactive {
      background: #E8E8E8;
      color: #666;
    }
    
    .duration-input {
      margin: 15px 0;
    }
    
    .duration-input label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    .duration-presets {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .preset-btn {
      flex: 1;
      padding: 8px;
      border: 2px solid #E0E0E0;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .preset-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }
    
    .preset-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    
    .custom-duration {
      display: flex;
      gap: 8px;
    }
    
    .custom-duration input {
      flex: 1;
      padding: 8px;
      border: 2px solid #E0E0E0;
      border-radius: 6px;
      font-size: 14px;
    }
    
    .custom-duration input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .controls {
      display: flex;
      gap: 10px;
    }
    
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }
    
    .btn-secondary {
      background: #E8E8E8;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #D0D0D0;
    }
    
    .btn-danger {
      background: #FF6B6B;
      color: white;
    }
    
    .btn-danger:hover {
      background: #FF5555;
    }
    
    .blocked-sites {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    
    .blocked-sites h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    
    .site-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .site-item {
      display: flex;
      align-items: center;
      padding: 8px;
      background: #F5F5F5;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .site-item input {
      margin-right: 8px;
      cursor: pointer;
    }
    
    .timer {
      color: white;
      text-align: center;
      font-size: 36px;
      font-weight: 300;
      margin: 15px 0;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1>🎯 Focus Mode</h1>
    </div>
    
    <div class="status">
      <div class="status-badge" id="status-badge">Not Active</div>
      <div class="timer" id="timer" style="display: none;">25:00</div>
      
      <div class="duration-input" id="duration-input">
        <label>Session Duration</label>
        <div class="duration-presets">
          <button class="preset-btn active" data-duration="25">25 min</button>
          <button class="preset-btn" data-duration="45">45 min</button>
          <button class="preset-btn" data-duration="90">90 min</button>
        </div>
        <div class="custom-duration">
          <input type="number" id="custom-duration" placeholder="Custom (min)" min="1" max="480" value="25">
          <button class="preset-btn" onclick="setCustomDuration()">Set</button>
        </div>
      </div>
      
      <div class="controls">
        <button class="btn btn-primary" id="start-btn">Start Focus</button>
        <button class="btn btn-danger" id="stop-btn" style="display: none;">Stop</button>
      </div>
    </div>
    
    <div class="blocked-sites">
      <h3>Blocked Sites</h3>
      <div class="site-list" id="site-list"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
