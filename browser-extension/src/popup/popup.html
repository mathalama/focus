<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 380px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    
    .popup-container {
      padding: 16px;
    }
    
    .header {
      color: #ffffff;
      margin-bottom: 16px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .status {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      font-family: monospace;
    }
    
    .status-badge.active {
      background: #333;
      color: #ffffff;
    }
    
    .status-badge.inactive {
      background: #444;
      color: #888;
    }
    
    .timer {
      color: #ffffff;
      text-align: center;
      font-size: 32px;
      font-weight: 300;
      margin: 12px 0;
      font-family: monospace;
    }
    
    .info-text {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: 8px;
    }
    
    .blocked-sites {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    
    .blocked-sites h3 {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .site-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    
    .site-item {
      display: flex;
      align-items: center;
      padding: 8px;
      background: #333;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .site-item:hover {
      background: #3a3a3a;
    }
    
    .site-item input {
      margin-right: 8px;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }
    
    .site-item span {
      color: #d0d0d0;
      flex: 1;
    }
    
    /* Scrollbar styling */
    .site-list::-webkit-scrollbar {
      width: 6px;
    }
    
    .site-list::-webkit-scrollbar-track {
      background: #2a2a2a;
    }
    
    .site-list::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }
    
    .site-list::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1>Focus Mode</h1>
    </div>
    
    <div class="status">
      <div class="status-badge" id="status-badge">○ Not Active</div>
      <div class="timer" id="timer" style="display: none;"></div>
      
      <p class="info-text">
        Controlled from your dashboard
      </p>
    </div>
    
    <div class="blocked-sites">
      <h3>Block These Sites</h3>
      <div class="site-list" id="site-list"></div>
    </div>
  </div>

  <script src="popup/popup.js"></script>
</body>
</html>
